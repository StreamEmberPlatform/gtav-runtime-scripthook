; StreamEmber Runtime (GTA V) - <game>\StreamEmber\Config\Runtime.ini
; Lines starting with ';', '#' or '//' are ignored.
; Key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys (e.g. F4, Insert, OemSemicolon).
; F7 / F8 are used by the StreamEmber overlay.

; Reload all scripts (None = off)
ReloadKeyBinding=None

; Open / close the runtime console
ConsoleKeyBinding=F4

; Milliseconds a script may run in one tick before it is reported as hanging
ScriptTimeoutThreshold=5000

; Scripts folder. Relative paths start at the game folder (where GTA5.exe is).
ScriptsLocation="StreamEmber\Scripts"

; Start every script in the scripts folder when the game session starts or the runtime reloads.
; false = start them from the console (StartAllScripts).
AutoLoadScripts=true

; --- StreamEmber Live (stream-driven mods: scripts deriving from StreamEmber.Live.LiveScript) ---
; Identity comes from the StreamEmber Launcher (customer UUID + runtime token); nothing to set for normal use.

; false = no EventFabric connection, presence or Falcon settings for live mods
LiveEnabled=true

; Code or application UUID of the live mod to activate when several are installed (empty = the first one)
LiveModule=

; Show "viewer > action" on screen for every incoming action
LiveAnnounceActions=true

; Ctrl+Shift+F1..F9 run the first nine schema actions as tests, F10 status, F11 reload settings, F12 reset GCore
LiveTestHotkeys=true

; Extra [Live] lines in the log
LiveDebug=false

; Service addresses (empty = defaults: eventfabric/falcon.streamember.com, launcher from STREAMEMBER_LOCAL_API or 127.0.0.1:47880)
LiveEventFabricUrl=
LiveFalconUrl=
LiveLauncherUrl=

; Development only: read events and settings for this customer UUID without the launcher (writes still need a token)
LiveCustomerUuid=
