; StreamEmber Runtime (GTA V) - <game>\StreamEmber\Config\Runtime.ini
; Lines starting with ';', '#' or '//' are ignored.
; Key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys (e.g. F4, Insert, OemSemicolon).
; F7 / F8 are used by the StreamEmber overlay.

; Reload all scripts (None = off)
ReloadKeyBinding=None

; Open / close the runtime console
ConsoleKeyBinding=F4

; Milliseconds a script may run in one tick before it is reported as hanging
ScriptTimeoutThreshold=5000

; Scripts folder. Relative paths start at the game folder (where GTA5.exe is).
ScriptsLocation="StreamEmber\Scripts"

; Start every script in the scripts folder when the game session starts or the runtime reloads.
; false = start them from the console (StartAllScripts).
AutoLoadScripts=true
